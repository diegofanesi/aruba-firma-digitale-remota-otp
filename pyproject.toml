[project]
name = "aruba-firma"
version = "0.3.3"
description = "Client per la firma digitale remota Aruba (ARSS): riga di comando e interfaccia grafica"
authors = [{ name = "Diego Fanesi", email = "diego.fanesi@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.12,<3.15"
dependencies = [
    "zeep>=4.3",
    "keyring>=25",
    "asn1crypto>=1.5",
    "pypdf>=5",
    "pyhanko[etsi,requests]>=0.38",
]

[project.scripts]
aruba-firma = "firmaremota.cli:main"

[project.gui-scripts]
aruba-firma-gui = "firmaremota.gui.app:main"

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.9,<6.13"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4",
    "cryptography>=42",
    "PySide6-Essentials>=6.9,<6.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firmaremota"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Aruba service (needs FIRMA_LIVE=1 and an OTP)"]
